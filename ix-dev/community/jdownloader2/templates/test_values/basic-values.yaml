resources:
  limits:
    cpus: 2.0
    memory: 4096

jdownloader2:
  myjd_name: ""
  myjd_user: ""
  myjd_password: ""
  additional_envs: []

network:
  host_network: false
  webui_port:
    bind_mode: published
    port_number: 30800
  direct_connection_port:
    bind_mode: ""
    port_number: 3129

run_as:
  user: 568
  group: 568

ix_volumes:
  config: /opt/tests/mnt/config
  downloads: /opt/tests/mnt/downloads

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  downloads:
    type: ix_volume
    ix_volume_config:
      dataset_name: downloads
      create_host_path: true
  additional_storage: []
